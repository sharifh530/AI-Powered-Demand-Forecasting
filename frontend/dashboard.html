<div id="app" class="app-container"></div>

<script>
// ============================================================================
// Configuration & State Management
// ============================================================================

const API_BASE_URL = 'http://localhost:8000/api';

const STATE = {
  user: null,
  accessToken: null,
  refreshToken: null,
  currentView: 'overview',
  forecasts: [],
  models: [],
  inventory: [],
  loading: false
};

// ============================================================================
// API Service Layer
// ============================================================================

const API = {
  async request(endpoint, options = {}) {
    const config = {
      headers: {
        'Content-Type': 'application/json',
        ...(STATE.accessToken && { 'Authorization': `Bearer ${STATE.accessToken}` })
      },
      ...options
    };

    try {
      const response = await fetch(`${API_BASE_URL}${endpoint}`, config);

      if (response.status === 401) {
        // Token expired, try to refresh
        const refreshed = await this.refreshToken();
        if (refreshed) {
          // Retry original request with new token
          config.headers.Authorization = `Bearer ${STATE.accessToken}`;
          const retryResponse = await fetch(`${API_BASE_URL}${endpoint}`, config);
          return retryResponse.ok ? await retryResponse.json() : null;
        }
        // Refresh failed, logout
        logout();
        return null;
      }

      return response.ok ? await response.json() : null;
    } catch (error) {
      console.error('API Error:', error);
      return null;
    }
  },

  async login(username, password) {
    const response = await fetch(`${API_BASE_URL}/auth/token/`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });

    if (response.ok) {
      const data = await response.json();
      STATE.accessToken = data.access;
      STATE.refreshToken = data.refresh;
      STATE.user = { username, role: 'planner' }; // Adjust based on actual response

      // Persist tokens
      try {
        localStorage.setItem('accessToken', data.access);
        localStorage.setItem('refreshToken', data.refresh);
        localStorage.setItem('user', JSON.stringify(STATE.user));
      } catch (e) {
        console.warn('localStorage unavailable');
      }

      return true;
    }
    return false;
  },

  async refreshToken() {
    if (!STATE.refreshToken) return false;

    try {
      const response = await fetch(`${API_BASE_URL}/auth/token/refresh/`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh: STATE.refreshToken })
      });

      if (response.ok) {
        const data = await response.json();
        STATE.accessToken = data.access;
        try {
          localStorage.setItem('accessToken', data.access);
        } catch (e) {}
        return true;
      }
    } catch (error) {
      console.error('Token refresh failed:', error);
    }
    return false;
  },

  async getForecasts(filters = {}) {
    const params = new URLSearchParams(filters);
    return await this.request(`/forecasting/forecasts/?${params}`);
  },

  async getModels() {
    return await this.request('/forecasting/model-runs/');
  },

  async triggerTraining() {
    return await this.request('/forecasting/model-runs/trigger_training/', {
      method: 'POST',
      body: JSON.stringify({})
    });
  },

  async getLowStockAlerts() {
    return await this.request('/inventory/items/low_stock_alerts/');
  }
};

// ============================================================================
// UI Components
// ============================================================================

function Icon(name) {
  const icons = {
    dashboard: '<svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>',
    chart: '<svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>',
    brain: '<svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>',
    package: '<svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>',
    alert: '<svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>',
    refresh: '<svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>',
    play: '<svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>',
    up: '↑',
    down: '↓'
  };
  return icons[name] || '';
}

function Sidebar() {
  const navItems = [
    { id: 'overview', label: 'Overview', icon: 'dashboard' },
    { id: 'forecasts', label: 'Forecast Explorer', icon: 'chart' },
    { id: 'models', label: 'Model Management', icon: 'brain' },
    { id: 'inventory', label: 'Inventory Alerts', icon: 'alert' }
  ];

  return `
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="logo">📈 DemandIQ</div>
      </div>

      <div class="nav-menu">
        ${navItems.map(item => `
          <div class="nav-item ${STATE.currentView === item.id ? 'active' : ''}"
               onclick="navigateTo('${item.id}')">
            ${Icon(item.icon)}
            <span>${item.label}</span>
          </div>
        `).join('')}
      </div>

      <div class="sidebar-footer">
        ${STATE.user ? `
          <div class="user-info">
            <div class="user-avatar">${STATE.user.username.charAt(0).toUpperCase()}</div>
            <div class="user-details">
              <div class="user-name">${STATE.user.username}</div>
              <div class="user-role">${STATE.user.role || 'User'}</div>
            </div>
          </div>
          <button class="btn-logout" onclick="logout()">Sign Out</button>
        ` : ''}
      </div>
    </div>
  `;
}

function TopBar(title) {
  return `
    <div class="top-bar">
      <h1 class="page-title">${title}</h1>
      <div class="top-actions">
        <button class="btn btn-secondary" onclick="loadData()">
          ${Icon('refresh')} Refresh
        </button>
      </div>
    </div>
  `;
}

function OverviewView() {
  return `
    <div class="view-section ${STATE.currentView === 'overview' ? 'active' : ''}" id="view-overview">
      ${TopBar('Executive Overview')}
      <div class="content-area">
        <div class="kpi-grid">
          <div class="kpi-card">
            <div class="kpi-label">Champion WAPE</div>
            <div class="kpi-value">12.19%</div>
            <div class="kpi-change positive">${Icon('up')} 2.3% vs baseline</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Active Forecasts</div>
            <div class="kpi-value">784</div>
            <div class="kpi-change positive">${Icon('up')} 14-day horizon</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Low Stock Alerts</div>
            <div class="kpi-value">0</div>
            <div class="kpi-change">No immediate risk</div>

function navigateTo(view) {
  STATE.currentView = view;
  render();
  loadData();
}

async function loadData() {
  if (STATE.currentView === 'overview') {
    await loadOverviewChart();
    await loadModels();
  } else if (STATE.currentView === 'forecasts') {
    await loadForecasts();
  } else if (STATE.currentView === 'models') {
    await loadModels();
  } else if (STATE.currentView === 'inventory') {
    await loadInventory();
  }
}

async function loadOverviewChart() {
  const canvas = document.getElementById('overviewChart');
  if (!canvas) return;

  const ctx = canvas.getContext('2d');

  // Mock aggregated forecast data
  const labels = ['Sep 05', 'Sep 06', 'Sep 07', 'Sep 08', 'Sep 09', 'Sep 10', 'Sep 11',
                  'Sep 12', 'Sep 13', 'Sep 14', 'Sep 15', 'Sep 16', 'Sep 17', 'Sep 18'];

  const data = {
    labels,
    datasets: [
      {
        label: 'Forecasted Demand',
        data: [1250, 1320, 1280, 1410, 1580, 1620, 1550, 1380, 1420, 1460, 1520, 1640, 1720, 1650],
        borderColor: '#2563eb',
        backgroundColor: 'rgba(37, 99, 235, 0.1)',
        borderWidth: 2.5,
        tension: 0.3,
        fill: true
      }
    ]
  };

  new Chart(ctx, {
    type: 'line',
    data,
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { position: 'top' },
        tooltip: {
          backgroundColor: getComputedStyle(document.documentElement).getPropertyValue('--bg-surface'),
          titleColor: getComputedStyle(document.documentElement).getPropertyValue('--text-primary'),
          bodyColor: getComputedStyle(document.documentElement).getPropertyValue('--text-secondary'),
          borderColor: getComputedStyle(document.documentElement).getPropertyValue('--border'),
          borderWidth: 1
        }
      },
      scales: {
        x: { grid: { color: getComputedStyle(document.documentElement).getPropertyValue('--border') } },
        y: {
          grid: { color: getComputedStyle(document.documentElement).getPropertyValue('--border') },
          title: { display: true, text: 'Demand (Units)' }
        }
      }
    }
  });
}

async function handleLogin(event) {
  event.preventDefault();

  const username = document.getElementById('loginUsername').value;
  const password = document.getElementById('loginPassword').value;
  const errorEl = document.getElementById('loginError');

  errorEl.style.display = 'none';

  // Mock login - in production, call API.login()
  STATE.user = { username, role: 'planner' };
  STATE.accessToken = 'mock-token';

  try {
    localStorage.setItem('user', JSON.stringify(STATE.user));
    localStorage.setItem('accessToken', STATE.accessToken);
  } catch (e) {}

  render();
  loadData();
}

function logout() {
  STATE.user = null;
  STATE.accessToken = null;
  STATE.refreshToken = null;

  try {
    localStorage.removeItem('user');
    localStorage.removeItem('accessToken');
    localStorage.removeItem('refreshToken');
  } catch (e) {}

  render();
}

function checkAuth() {
  try {
    const savedUser = localStorage.getItem('user');
    const savedToken = localStorage.getItem('accessToken');
    const savedRefresh = localStorage.getItem('refreshToken');

    if (savedUser && savedToken) {
      STATE.user = JSON.parse(savedUser);
      STATE.accessToken = savedToken;
      STATE.refreshToken = savedRefresh;
      return true;
    }
  } catch (e) {}

  return false;
}

function render() {
  const app = document.getElementById('app');

  if (!STATE.user) {
    app.innerHTML = LoginModal();
    return;
  }

  app.innerHTML = `
    ${Sidebar()}
    <div class="main-content">
      ${OverviewView()}
      ${ForecastsView()}
      ${ModelsView()}
      ${InventoryView()}
    </div>
  `;
}

window.addEventListener('DOMContentLoaded', () => {
  checkAuth();
  render();

  if (STATE.user) {
    loadData();
  }
});
